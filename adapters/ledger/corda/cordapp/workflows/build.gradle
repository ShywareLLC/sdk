apply plugin: 'net.corda.plugins.cordapp'
apply plugin: 'net.corda.plugins.quasar-utils'

cordapp {
    targetPlatformVersion corda_platform_version.toInteger()
    minimumPlatformVersion 8
    workflow {
        name "Shyware Two-List Invariant Flows"
        vendor "Shyware LLC"
        licence "Apache License, Version 2.0"
        versionId 1
    }
}

sourceSets {
    main {
        kotlin {
            srcDirs = ['src/main/kotlin']
        }
    }
    test {
        kotlin {
            srcDirs = ['src/test/kotlin']
        }
    }
}

dependencies {
    cordaCompile "$corda_release_group:corda-core:$corda_release_version"
    cordapp project(':contracts')

    testCompile "junit:junit:$junit_version"
    testCompile "$corda_release_group:corda-node-driver:$corda_release_version"
    testCompile "$corda_release_group:corda-test-utils:$corda_release_version"
}

jar {
    baseName 'shyware-corda-workflows'
}

test {
    // The driver framework spins up real (in-process) node processes; give it room.
    maxHeapSize = "2g"
    forkEvery = 1
}
