apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

buildscript {
    repositories { mavenCentral() }
    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:$spring_boot_gradle_plugin_version"
    }
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web:$spring_boot_version"
    implementation "$corda_release_group:corda-rpc:$corda_release_version"

    // Needed on the classpath so startFlowDynamic can resolve the flow Class objects and
    // their (de)serialized argument/return types by name.
    implementation project(':workflows')
    implementation project(':contracts')
}

bootJar {
    baseName 'shyware-corda-webserver'
    mainClassName = 'com.shyware.corda.webserver.WebserverApplicationKt'
}
