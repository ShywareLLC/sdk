# Corda 4.x is JVM-8-only and pinned to Gradle 6.x via corda-gradle-plugins.
# This module targets exactly the versions the official cordapp-template-kotlin
# used for the Corda 4.11 open-source line -- verified compatible in R3's own
# templates as of this writing. Do not bump the JDK target without checking
# Corda's own compatibility matrix first; Corda 4.x does not run on JDK 11+.
corda_release_group = net.corda
corda_core_release_group = net.corda
corda_release_version = 4.11
corda_core_release_version = 4.11
corda_gradle_plugins_version = 6.1.6
kotlin_version = 1.9.24
quasar_version = 0.8.5
quasar_classifier = jdk8
junit_version = 4.13.2
corda_platform_version = 12
spring_boot_version = 2.7.18
spring_boot_gradle_plugin_version = 2.7.18
